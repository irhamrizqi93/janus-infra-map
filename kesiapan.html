<meta charset="utf-8"><title>Kesiapan Data Area</title>
<style>
:root{--navy:#10384F;--blue:#0071BC;--ok:#2E7D32;--ok-bg:#E7F4EA;--half:#B26A00;--half-bg:#FBEFD6;
 --miss:#B0392F;--miss-bg:#FBE9E7;--ink:#10384F;--ink2:#3E5B6D;--ink3:#8A8579;--ink4:#9DAFBA;
 --line:rgba(16,56,79,.11);--hair:rgba(16,56,79,.06);--surface:#fff;--canvas:#FBFAF7;--rail:#EDF1F3;
 --font:-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);font-family:var(--font);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:390px;margin:0 auto;padding:14px 13px 40px}
.h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.hp{font-size:12.5px;color:var(--ink3);margin:3px 0 12px;line-height:1.45}
.lbl{font:700 10.5px/1 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:6px 2px 8px}
/* headline roster */
.rost{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.rrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-top:1px solid var(--hair);cursor:pointer}
.rrow:first-child{border-top:0}
.rrow.sel{background:#F0F6FB}
.rrow .nm{font-size:14px;font-weight:700;flex:0 0 auto;width:64px}
.rrow .ar{font-size:11px;color:var(--ink3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .bar{width:66px;height:7px;border-radius:4px;background:var(--rail);overflow:hidden;flex:0 0 auto}
.rrow .bar i{display:block;height:100%}
.rrow .sc{font-size:12px;font-weight:800;width:26px;text-align:right;flex:0 0 auto}
/* filter */
.fbar{display:flex;gap:8px;margin-bottom:10px}
.fbar select{flex:1;font:inherit;font-weight:600;font-size:13px;color:var(--ink);background:var(--surface);
 border:1px solid var(--line);border-radius:10px;padding:9px 30px 9px 11px;appearance:none;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%236E8494' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
 background-repeat:no-repeat;background-position:right 9px center}
/* detail card */
.tm{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,56,79,.05)}
.tmtop{display:flex;align-items:center;gap:12px}
.ring{width:50px;height:50px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:5px;background:var(--surface);border-radius:50%}
.ring b{position:relative;font-size:14px;font-weight:800}
.tmname{font-size:15.5px;font-weight:800;line-height:1.2}
.tmsub{font-size:11.5px;color:var(--ink3);margin-top:1px}
.tmcount{font-size:11.5px;font-weight:700;margin-top:3px}
.items{margin-top:10px;border-top:1px solid var(--hair)}
.it{border-bottom:1px solid var(--hair)}
.itrow{display:flex;align-items:center;gap:10px;padding:9px 2px;cursor:pointer}
.ic{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:800}
.i-ok{background:var(--ok-bg);color:var(--ok)} .i-half{background:var(--half-bg);color:var(--half)} .i-miss{background:var(--miss-bg);color:var(--miss)}
.itl{flex:1;font-size:13.5px;font-weight:600;min-width:0}
.itl .imp{color:var(--miss);font-weight:800;font-size:11px}
.ist{font-size:11.5px;font-weight:700;white-space:nowrap}
.ist.ok{color:var(--ok)} .ist.half{color:var(--half)} .ist.miss{color:var(--miss)}
.chev{color:var(--ink4);font-size:11px;transition:transform .15s;flex:0 0 auto}
.it.open .chev{transform:rotate(90deg)}
.det{display:none;padding:0 2px 11px 30px;font-size:12px;color:var(--ink3);line-height:1.5}
.it.open .det{display:block}
.det .why{color:var(--ink2)} .det .hint{color:var(--blue);font-weight:600;margin-top:3px}
.empty{padding:14px 4px;color:var(--ink3);font-size:13px;text-align:center}
.foot{font-size:11px;color:var(--ink4);text-align:center;margin-top:12px;line-height:1.6}
</style>
<div class="wrap">
<div class="h1">Kesiapan Data Area</div>
<div class="hp">Central Java · 3 TM live. Tap TM buat lihat detail data yang kurang. Makin lengkap → Janus makin lancar.</div>

<div class="lbl">Ringkasan 3 TM</div>
<div class="rost" id="roster"></div>

<div class="fbar">
  <select id="ftm" onchange="pick(this.value)"><option value="">Pilih TM…</option></select>
  <select id="fst" onchange="rend()"><option value="">Semua status</option><option value="kurang">Kurang saja</option><option value="ok">Lengkap saja</option></select>
</div>
<div id="detail"></div>
<div class="foot">Data fondasi = disiapkan 1× saat gabung. BRP/kegiatan (update terus) TIDAK dihitung.<br>LIVE dari data tiap TM · 25 Aug 2026 18:51</div>
</div>

<script>
var ITEMS=[
 {n:1,label:"Profil TM & Teritori",why:"siapa TM, pegang wilayah mana"},
 {n:2,label:"Roster DR (DSR & DMR)",why:"nama, kontak, SIMID, peran tiap DR"},
 {n:3,label:"Mapping Kecamatan → DSR & DMR",why:"tiap kecamatan: DR kios & DR petani"},
 {n:4,label:"Master Kios",why:"ID, nama, R1/R2, kategori kios"},
 {n:5,label:"Target KPI FY — TM & DR (Rp)",why:"target setahun TM & tiap DR"},
 {n:6,label:"Target Kios (Poin)",why:"target poin per kios — dasar KPI & kalkulator",imp:1}
];
// data NYATA dari mapping CJ (+ Irham in-system). st: item→[status, detail]. det: item→{hint}
function base(kios,kec,dsr){return {
 1:["miss","belum ada"],2:["half",dsr+" DSR, DMR belum"],3:["half",kec+" kec, DMR kosong"],
 4:["ok",kios+" kios (R2)"],5:["miss","belum ada"],6:["miss","belum ada"]};}
function baseDet(){return {1:{hint:"isi identitas + konfirmasi teritori"},2:{hint:"tambah DR Petani (DMR)"},
 3:{hint:"isi DR Petani tiap kecamatan"},5:{hint:"minta target KPI ke HO"},6:{hint:"minta target poin per kios ke HO"}};}
var TMS=[{"name": "Bang Irham", "area": "CP Semarang · acuan", "st": {"1": ["ok", "acuan"], "2": ["ok", "acuan"], "3": ["ok", "acuan"], "4": ["ok", "acuan"], "5": ["ok", "acuan"], "6": ["ok", "acuan"]}, "det": {}}, {"name": "Hanif", "area": "CP - Pekalongan · 143 kios", "st": {"1": ["miss", "belum ada"], "2": ["half", "6 DSR, DMR belum"], "3": ["half", "45 kec, DMR kosong"], "4": ["ok", "143 kios"], "5": ["miss", "belum ada"], "6": ["miss", "belum ada"]}, "det": {"1": {"hint": "isi identitas + konfirmasi teritori"}, "2": {"hint": "tambah DR Petani (DMR) tiap kecamatan"}, "3": {"hint": "isi DR Petani tiap kecamatan"}, "5": {"hint": "minta target KPI ke HO"}, "6": {"hint": "minta target poin per kios ke HO"}}}, {"name": "Dharma", "area": "CP - Solo Raya · 267 kios", "st": {"1": ["ok", "Darma Nur Arifin"], "2": ["half", "2 DSR, DMR belum"], "3": ["half", "84 kec, DMR kosong"], "4": ["ok", "267 kios"], "5": ["ok", "ada"], "6": ["miss", "belum ada"]}, "det": {"2": {"hint": "tambah DR Petani (DMR) tiap kecamatan"}, "3": {"hint": "isi DR Petani tiap kecamatan"}, "6": {"hint": "minta target poin per kios ke HO"}}}];
var ICO={ok:"✓",half:"◐",miss:"○"};
function score(t){var s=0;ITEMS.forEach(function(it){var k=t.st[it.n][0];s+=k==='ok'?1:k==='half'?.5:0;});return Math.round(s/ITEMS.length*100);}
function nok(t){return ITEMS.filter(function(it){return t.st[it.n][0]==='ok';}).length;}
function col(p){return p>=80?'var(--ok)':p>=45?'var(--half)':'var(--miss)';}
var SEL=-1;
var tmSel=document.getElementById('ftm');
TMS.forEach(function(t,i){var o=document.createElement('option');o.value=i;o.textContent=t.name;tmSel.appendChild(o);});
function roster(){
 document.getElementById('roster').innerHTML=TMS.map(function(t,i){
  var p=score(t);
  return '<div class="rrow'+(i===SEL?' sel':'')+'" onclick="pick('+i+')"><div class="nm">'+t.name+'</div>'
   +'<div class="ar">'+t.area.split(' · ')[0]+'</div>'
   +'<div class="bar"><i style="width:'+p+'%;background:'+col(p)+'"></i></div>'
   +'<div class="sc" style="color:'+col(p)+'">'+nok(t)+'/6</div></div>';
 }).join('');
}
function pick(i){SEL=(i===''?-1:+i);document.getElementById('ftm').value=(SEL<0?'':SEL);roster();rend();
 if(SEL>=0)document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});}
function rend(){
 roster();
 if(SEL<0){document.getElementById('detail').innerHTML='<div class="empty">↑ Tap TM di atas buat lihat detail data yang kurang.</div>';return;}
 var t=TMS[SEL], fS=document.getElementById('fst').value, p=score(t);
 var rows='';
 ITEMS.forEach(function(it){var k=t.st[it.n][0];
  if(fS==='kurang'&&k==='ok')return; if(fS==='ok'&&k!=='ok')return;
  var d=(t.det&&t.det[it.n])||{};
  rows+='<div class="it" onclick="this.classList.toggle(\'open\')"><div class="itrow"><div class="ic i-'+k+'">'+ICO[k]+'</div>'
   +'<div class="itl">'+it.n+'. '+it.label+(it.imp&&k!=='ok'?' <span class="imp">· penting</span>':'')+'</div>'
   +'<div class="ist '+k+'">'+t.st[it.n][1]+'</div><div class="chev">▶</div></div>'
   +'<div class="det"><span class="why">'+it.why+'</span>'+(d.hint?'<div class="hint">→ '+d.hint+'</div>':'')+'</div></div>';
 });
 if(rows==='')rows='<div class="empty">— tak ada item di filter ini —</div>';
 document.getElementById('detail').innerHTML='<div class="tm"><div class="tmtop">'
  +'<div class="ring" style="background:conic-gradient('+col(p)+' '+p+'%,var(--rail) 0)"><b style="color:'+col(p)+'">'+p+'%</b></div>'
  +'<div><div class="tmname">'+t.name+'</div><div class="tmsub">'+t.area+'</div>'
  +'<div class="tmcount" style="color:'+col(p)+'">'+nok(t)+'/6 lengkap</div></div></div>'
  +'<div class="items">'+rows+'</div></div>';
}
roster();rend();
</script>
